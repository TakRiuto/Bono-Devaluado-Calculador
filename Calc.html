<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora: ¿Cuánto perdiste de Bono FTTX?</title>
  <!-- Tailwind CSS para el diseño -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
    
    <!-- Encabezado -->
    <div class="text-center mb-6">
      <div class="inline-flex p-3 bg-red-500/10 text-red-400 rounded-full mb-3">
        <i data-lucide="trending-down" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">¿Cuánto perdiste de Bono?</h1>
      <p class="text-xs text-slate-400 mt-1">Cálculo de devaluación - Bono FTTX</p>
    </div>

    <!-- Comparativa de Tasas -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 text-center">
        <span class="text-xs text-slate-400 block mb-1">Tasa Aprobada</span>
        <span class="text-sm font-semibold text-emerald-400">Bs. 859,00</span>
      </div>
      <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 text-center relative">
        <span class="text-xs text-slate-400 block mb-1">Tasa BCV Hoy</span>
        <span id="tasaBCVTexto" class="text-sm font-semibold text-yellow-400">
          <span class="animate-pulse">Cargando...</span>
        </span>
      </div>
    </div>

    <!-- Formulario -->
    <div class="space-y-4 mb-6">
      <div>
        <label for="montoBs" class="block text-xs font-medium text-slate-300 mb-1.5">
          Monto que recibiste en Bolívares (Bs.):
        </label>
        <div class="relative">
          <input 
            type="number" 
            id="montoBs" 
            placeholder="Ej: 85900" 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all"
            oninput="calcularPerdida()"
          >
          <span class="absolute right-4 top-3 text-slate-500 text-sm font-semibold">Bs.</span>
        </div>
      </div>
    </div>

    <!-- Resultados -->
    <div id="resultados" class="hidden space-y-4">
      
      <div class="border-t border-slate-700/60 pt-4 space-y-2">
        <div class="flex justify-between text-sm">
          <span class="text-slate-400">Era equivalente a:</span>
          <span id="usdOriginal" class="font-semibold text-slate-200">$0.00</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-400">Hoy equivale a:</span>
          <span id="usdActual" class="font-semibold text-slate-200">$0.00</span>
        </div>
      </div>

      <!-- Tarjeta de Pérdida -->
      <div class="bg-red-950/40 border border-red-500/30 rounded-xl p-4 text-center">
        <span class="text-xs font-semibold uppercase tracking-wider text-red-400 block mb-1">
          Pérdida Total
        </span>
        <div class="text-3xl font-black text-red-500 mb-1" id="diferenciaUsd">
          -$0.00
        </div>
        <span id="porcentajePerdida" class="text-xs bg-red-500/20 text-red-300 px-2.5 py-0.5 rounded-full inline-block font-medium">
          -0%
        </span>
      </div>

    </div>

  </div>

  <script>
    // Inicializar iconos
    lucide.createIcons();

    const TASA_FIJA = 859.0629;
    let tasaBCVActual = 0;

    // 1. Obtener la tasa actual del BCV usando DolarApi
    async function obtenerTasaBCV() {
      try {
        const res = await fetch("https://ve.dolarapi.com/v1/dolares/oficial");
        const data = await res.json();
        
        if (data && data.promedio) {
          tasaBCVActual = parseFloat(data.promedio);
          document.getElementById('tasaBCVTexto').innerText = `Bs. ${tasaBCVActual.toFixed(2)}`;
          calcularPerdida(); // Si el usuario ya escribió algo, calcula
        }
      } catch (error) {
        document.getElementById('tasaBCVTexto').innerHTML = `<span class="text-red-400">Error</span>`;
        console.error("Error al obtener la tasa BCV:", error);
      }
    }

    // 2. Función de cálculo en tiempo real
    function calcularPerdida() {
      const input = document.getElementById('montoBs').value;
      const montoBs = parseFloat(input);
      const contenedorResultados = document.getElementById('resultados');

      // Validar que haya un monto válido y la tasa esté cargada
      if (isNaN(montoBs) || montoBs <= 0 || tasaBCVActual === 0) {
        contenedorResultados.classList.add('hidden');
        return;
      }

      // Cálculos
      const usdOriginal = montoBs / TASA_FIJA;
      const usdActual = montoBs / tasaBCVActual;
      const perdidaUsd = usdOriginal - usdActual;
      const porcentaje = ((perdidaUsd / usdOriginal) * 100);

      // Formateador de moneda en USD
      const formatoUSD = new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 2
      });

      // Actualizar interfaz
      document.getElementById('usdOriginal').innerText = formatoUSD.format(usdOriginal);
      document.getElementById('usdActual').innerText = formatoUSD.format(usdActual);
      document.getElementById('diferenciaUsd').innerText = `-${formatoUSD.format(perdidaUsd)}`;
      document.getElementById('porcentajePerdida').innerText = `Has perdido el ${porcentaje.toFixed(2)}% del valor`;

      // Mostrar contenedor
      contenedorResultados.classList.remove('hidden');
    }

    // Ejecutar al cargar la página
    obtenerTasaBCV();
  </script>
</body>
</html>
